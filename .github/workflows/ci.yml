name: CI

# Build check for pull requests targeting next, so a broken TypeScript build
# never reaches the development branch (and therefore never reaches main).

on:
  pull_request:
    branches: [next]
    paths:
      - 'packages/**'
      - 'migrations/**'
      - 'migrations-pg/**'
      - 'mj-app.json'

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@11.6.4

      - name: Install workspace
        run: npm ci

      - name: Build workspace (dependency order)
        run: npm run build
