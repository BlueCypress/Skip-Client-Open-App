name: CI

# Build check for pull requests targeting next, so a broken TypeScript build
# never reaches the development branch (and therefore never reaches main).

on:
  pull_request:
    branches: [next]
    paths:
      - 'packages/**'
      - 'migrations/**'
      - 'migrations-pg/**'
      - 'mj-app.json'

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Build workspace (dependency order)
        run: npm run build
