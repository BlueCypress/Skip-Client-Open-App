name: Release & publish to npm

# Triggered automatically when next merges to main, or manually from the Actions tab.
# Uses @changesets/cli to version packages (lockstep via "fixed" config), publish to npm,
# and sync mj-app.json metadata. Changeset files (.changeset/*.md) created on feature
# branches drive the bump level (patch/minor/major).
#
# After publishing, the release commit is merged back into next to keep the branches in sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-askskip
  cancel-in-progress: false

jobs:
  release:
    name: Release & publish
    runs-on: ubuntu-latest
    # Skip release commits pushed by this workflow (they contain [skip ci] in the message)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@11.6.4

      - name: Install workspace
        run: npm ci

      - name: Set up git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin "https://$REPO_PAT@github.com/BlueCypress/Skip-Client-Open-App"
        env:
          REPO_PAT: ${{ secrets.BC_GH_BOT_GITHUB_TOKEN }}

      # Check for pending changesets. If none exist, there's nothing to release.
      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -cv README.md || true)
          echo "count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CHANGESET_COUNT" -eq 0 ]; then
            echo "No pending changesets — nothing to release."
          else
            echo "Found $CHANGESET_COUNT pending changeset(s)."
          fi

      # Apply changesets: bumps versions in all package.json files, writes CHANGELOG entries,
      # and deletes consumed .changeset/*.md files. The "fixed" config in .changeset/config.json
      # ensures all @askskip/* packages move in lockstep. "commit": true auto-commits the bump.
      - name: Version packages (changeset version)
        if: steps.changesets.outputs.count != '0'
        run: npm run version

      # Sync mj-app.json version from the just-bumped package version.
      - name: Sync mj-app.json version
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version packages/core/package.json)"
          jq --arg v "$VERSION" '.version = $v' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json
          echo "Updated mj-app.json version to $VERSION"

      # Sync mjVersionRange in mj-app.json to match the @memberjunction/core peer dep.
      # Same pattern as SaaS and bizapps-common: >=MIN <NEXT_MAJOR (e.g. >=5.45.1 <6.0.0).
      - name: Sync mjVersionRange in mj-app.json
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          MJ_RAW="$(jq -r '.peerDependencies["@memberjunction/core"]' packages/core/package.json)"
          MJ_MIN="$(echo "$MJ_RAW" | sed 's/^[^0-9]*//')"
          MJ_MAJOR="$(echo "$MJ_MIN" | cut -d. -f1)"
          MJ_NEXT_MAJOR="$(( MJ_MAJOR + 1 )).0.0"
          MJ_RANGE=">=${MJ_MIN} <${MJ_NEXT_MAJOR}"
          echo "Setting mjVersionRange to: $MJ_RANGE (from @memberjunction/core $MJ_RAW)"
          jq --arg range "$MJ_RANGE" '.mjVersionRange = $range' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json

      - name: Build workspace (dependency order)
        if: steps.changesets.outputs.count != '0'
        run: npm run build

      # Publish to npm. Uses OIDC trusted publishing (NPM_TOKEN='' signals npm to use OIDC).
      # Matching the MJ repo pattern: changeset publish handles dependency order and skips
      # already-published versions.
      - name: Publish to npm
        if: steps.changesets.outputs.count != '0'
        run: npx changeset publish
        env:
          NPM_TOKEN: ''

      # Get the version for tagging and commit message.
      - name: Get version string
        if: steps.changesets.outputs.count != '0'
        id: release
        run: |
          git pull
          VERSION="v$(jq -r .version packages/core/package.json)"
          echo "Release for version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Commit version bump + mj-app.json sync, tag, and push.
      # Done AFTER publish (matching MJ pattern) so the tag points to the released commit.
      - name: Commit, tag, and push the release
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (changeset commit: true may have already committed)."
          else
            git commit -m "chore(release): ${VERSION} [skip ci]"
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists — reusing it."
          else
            git tag "${VERSION}"
          fi
          git push origin HEAD:main --tags

      # Merge the release commit back to next so the branches stay in sync.
      - name: Merge main back to next
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          git fetch origin next
          git checkout next
          git merge main --no-ff -m "chore: merge main back to next after ${{ steps.release.outputs.version }} release [skip ci]"
          git push origin next
