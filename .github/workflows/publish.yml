name: Release & publish to npm

# Triggered automatically when next merges to main, or manually from the Actions tab.
# Uses @changesets/cli to version packages (lockstep via "fixed" config), publish to npm,
# and sync mj-app.json metadata. Changeset files (.changeset/*.md) created on feature
# branches drive the bump level (patch/minor/major).
#
# After publishing, the release commit is merged back into next to keep the branches in sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-askskip
  cancel-in-progress: false

jobs:
  release:
    name: Release & publish
    runs-on: ubuntu-latest
    # Skip release commits pushed by this workflow (they contain [skip ci] in the message)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write # commit the version bump + push the release tag to main
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # >= 22.14.0 required by trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest # trusted publishing requires npm >= 11.5.1

      - name: Install workspace
        run: npm ci

      # Check for pending changesets. If none exist, there's nothing to release.
      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -cv README.md || true)
          echo "count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$CHANGESET_COUNT" -eq 0 ]; then
            echo "No pending changesets — nothing to release."
          else
            echo "Found $CHANGESET_COUNT pending changeset(s)."
          fi

      # Apply changesets: bumps versions in all package.json files, writes CHANGELOG entries,
      # and deletes consumed .changeset/*.md files. The "fixed" config in .changeset/config.json
      # ensures all @askskip/* packages move in lockstep.
      - name: Version packages (changeset version)
        if: steps.changesets.outputs.count != '0'
        run: npm run version

      # Sync mj-app.json version from the just-bumped package version.
      - name: Sync mj-app.json version
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version packages/core/package.json)"
          jq --arg v "$VERSION" '.version = $v' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json
          echo "Updated mj-app.json version to $VERSION"

      # Sync mjVersionRange in mj-app.json to match the @memberjunction/core peer dep.
      # Same pattern as SaaS and bizapps-common: >=MIN <NEXT_MAJOR (e.g. >=5.45.1 <6.0.0).
      - name: Sync mjVersionRange in mj-app.json
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          MJ_RAW="$(jq -r '.peerDependencies["@memberjunction/core"]' packages/core/package.json)"
          MJ_MIN="$(echo "$MJ_RAW" | sed 's/^[^0-9]*//')"
          MJ_MAJOR="$(echo "$MJ_MIN" | cut -d. -f1)"
          MJ_NEXT_MAJOR="$(( MJ_MAJOR + 1 )).0.0"
          MJ_RANGE=">=${MJ_MIN} <${MJ_NEXT_MAJOR}"
          echo "Setting mjVersionRange to: $MJ_RANGE (from @memberjunction/core $MJ_RAW)"
          jq --arg range "$MJ_RANGE" '.mjVersionRange = $range' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json

      - name: Build workspace (dependency order)
        if: steps.changesets.outputs.count != '0'
        run: npm run build

      # Commit + tag + push BEFORE publishing so git and npm never drift.
      - name: Commit, tag, and push the release
        if: steps.changesets.outputs.count != '0'
        id: release
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version packages/core/package.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists — reusing it."
          else
            git tag "v${VERSION}"
          fi
          git push origin "v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publish via changeset publish. Uses OIDC trusted publishing (no NODE_AUTH_TOKEN needed).
      # publishConfig.access=public in each package.json ensures public visibility.
      # --no-git-tag prevents changeset from creating its own tags (we already did above).
      - name: Publish packages
        if: steps.changesets.outputs.count != '0'
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: '' # OIDC handles auth; explicit empty prevents changeset from erroring

      # Merge the release commit back to next so the branches stay in sync.
      # Uses --no-ff to create a merge commit for traceability.
      - name: Merge main back to next
        if: steps.changesets.outputs.count != '0'
        run: |
          set -euo pipefail
          git fetch origin next
          git checkout next
          git merge main --no-ff -m "chore: merge main back to next after v${{ steps.release.outputs.version }} release [skip ci]"
          git push origin next
