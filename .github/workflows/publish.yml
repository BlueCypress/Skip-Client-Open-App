name: Release & publish to npm

# Triggered automatically when next merges to main, or manually from the Actions tab.
# Uses @changesets/cli to version packages (lockstep via "fixed" config), publish to npm,
# and sync mj-app.json metadata. Changeset files (.changeset/*.md) created on feature
# branches drive the bump level (patch/minor/major).
#
# The pipeline is atomic — every step runs unconditionally. If there are no pending
# changesets, `changeset version` and `changeset publish` are no-ops, the commit/tag
# step finds nothing to push, and the merge-back still runs. This prevents orphaned
# states where main and next drift apart.
#
# Matches the MJ repo pattern: version → build → publish → commit+tag+push → merge back.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-askskip
  cancel-in-progress: false

jobs:
  release:
    name: Release & publish
    runs-on: ubuntu-latest
    # Skip release commits pushed by this workflow (they contain [skip ci] in the message)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@11.6.4

      - name: Install workspace
        run: npm ci

      - name: Set up git credentials
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin "https://$REPO_PAT@github.com/BlueCypress/Skip-Client-Open-App"
        env:
          REPO_PAT: ${{ secrets.SKIP_CLIENT_GH_BOT_TOKEN }}

      # Apply changesets: bumps versions in all package.json files, writes CHANGELOG entries,
      # and deletes consumed .changeset/*.md files. The "fixed" config in .changeset/config.json
      # ensures all @askskip/* packages move in lockstep. "commit": true auto-commits the bump.
      # No-op if there are no pending changesets.
      - name: Version packages
        run: npm run version

      # Sync mj-app.json version and mjVersionRange from the (possibly bumped) package versions.
      - name: Sync mj-app.json
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version packages/core/package.json)"
          jq --arg v "$VERSION" '.version = $v' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json
          echo "Updated mj-app.json version to $VERSION"

          MJ_RAW="$(jq -r '.peerDependencies["@memberjunction/core"]' packages/core/package.json)"
          MJ_MIN="$(echo "$MJ_RAW" | sed 's/^[^0-9]*//')"
          MJ_MAJOR="$(echo "$MJ_MIN" | cut -d. -f1)"
          MJ_NEXT_MAJOR="$(( MJ_MAJOR + 1 )).0.0"
          MJ_RANGE=">=${MJ_MIN} <${MJ_NEXT_MAJOR}"
          jq --arg range "$MJ_RANGE" '.mjVersionRange = $range' mj-app.json > mj-app.tmp && mv mj-app.tmp mj-app.json
          echo "Updated mj-app.json mjVersionRange to $MJ_RANGE"

      - name: Build workspace
        run: npm run build

      # Publish to npm. Uses OIDC trusted publishing (NPM_TOKEN='' signals npm to use OIDC).
      # changeset publish handles dependency order and skips already-published versions.
      # No-op if no versions were bumped.
      - name: Publish to npm
        run: npx changeset publish
        env:
          NPM_TOKEN: ''

      # Get the version for tagging and commit message.
      - name: Get version string
        id: version
        run: |
          git pull
          VERSION="v$(jq -r .version packages/core/package.json)"
          echo "Release for version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Stage any post-version/post-build generated files (mj-app.json, CHANGELOGs, etc.),
      # commit, tag, and push. Done AFTER publish so the tag points to the released commit.
      # If nothing changed (no changesets consumed), the commit and tag are skipped gracefully.
      - name: Commit, tag, and push the release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing was versioned."
          else
            git commit -m "chore(release): ${VERSION} [skip ci]"
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists — reusing it."
          else
            git tag "${VERSION}"
          fi
          git push origin HEAD:main --tags

      # Merge main back into next and regenerate the lockfile so next stays in sync
      # and CI doesn't fail on lockfile mismatches. Uses -X theirs to prevent merge
      # conflicts on version-bumped files (matching MJ pattern).
      - name: Merge main back to next
        run: |
          set -euo pipefail
          git fetch origin next
          git checkout next
          git merge -X theirs origin/main --no-ff -m "chore: merge main back to next after ${{ steps.version.outputs.VERSION }} release [skip ci]"
          npm install --package-lock-only
          LOCK_CHANGED="$(git status --porcelain package-lock.json)"
          if [ -n "$LOCK_CHANGED" ]; then
            git add package-lock.json
            git commit -m "chore: update package-lock.json with ${{ steps.version.outputs.VERSION }} dependencies [skip ci]"
          fi
          git push origin next
